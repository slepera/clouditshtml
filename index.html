<!DOCTYPE html>
<html>
<head>
	<title>Layout Example</title>
	<script src="index.js"></script>
	<link rel="stylesheet" href="index.css">
</head>

<body>
	
	<!-- Header Section -->
	<header>
		<div class="head1">ITS</div>
		<div class="head2">Digital Class</div>
	</header>
	
	<!-- Menu Navigation Bar -->
	<nav class="menu">
		<a href="#content">Content</a>
		<a href="calculator.html">Calculator</a>
		<a href="#notification">Notification</a>
		<div class="menu-log">
			<a href="#login">Login</a>
		</div>
	</nav>
	
	<!-- Body section -->
	<main class = "body_sec">
		<section id="content">
			<h3>This is the content section of the HTML page.</h3>
			<img id="myImage" src="bulb_off.png" width="100" height="180">
			<p>
				<button type="button" onclick="light('on')">Light On</button>
				<button type="button" onclick="light('off')">Light Off</button>
			</p>
			<p>
			<button onclick="generateRandomNumber()">Click me to generate a random number!</button>
			</p>
			<p class = "random_number" id="random_number"></p>
		</section>
	</main>
	
	<!-- Footer Section -->
	<footer>
		<section id="notification">
			This is the Footer Section
		</footer>
</body>
</html>
